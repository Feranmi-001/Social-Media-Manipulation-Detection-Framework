services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  pyspark:
    image: quay.io/jupyter/pyspark-notebook:spark-3.5.3
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      - JUPYTER_TOKEN=dev
    volumes:
      - ./work:/home/jovyan/work
    depends_on:
      - mongo

volumes:
  mongo_data: